# 開発用の MySQL を Docker で動かす設定（環境構築手順書 手順4・5、詳細設計 common.md 4章）。
# アプリ（Spring Boot）と画面（Vite）は Docker に入れず、PC で直接動かす。本番（AWS）では使わない（RDS を使う）。
#
# 使い方（このフォルダで）
#   起動：docker compose up -d      止める：docker compose stop
#   消す（データも消える）：docker compose down -v
#
# パスワードは、このフォルダの .env に書く（Git で管理しない。見本は .env.example）。
services:
  mysql:
    # 版は環境構築手順書 1.2 の表にそろえる。勝手に上げ下げしない
    image: mysql:8.4.13
    container_name: equipment-mysql
    environment:
      # root（管理者）のパスワード。開発の PC の中だけで使う
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env に MYSQL_ROOT_PASSWORD を書いてください}
      # 開発用のデータベースと、アプリ用のユーザ（equipment）を作る。
      # テスト用のデータベース（equipment_test）は docker/mysql/init の SQL で作る
      MYSQL_DATABASE: equipment_dev
      MYSQL_USER: equipment
      # secret.yml の spring.datasource.password と同じ値にする
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env に MYSQL_PASSWORD を書いてください}
      TZ: Asia/Tokyo
    # 文字コードと、文字の比べ方の決まり（照合順序。データ設計 2章）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_ja_0900_as_cs_ks
    ports:
      # この PC の中（127.0.0.1）からだけつなげる。番号はアプリの設定（localhost:3306）と同じ
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      # データを、コンテナを消しても残る場所（mysql-data）に置く
      - mysql-data:/var/lib/mysql
      # 最初の1回だけ流す SQL（データの場所が空のときだけ動く）
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    # メモリの上限（PC が重くならないように。足りなければ増やす）
    mem_limit: 1g
    restart: "no"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
