# 秘密の値の書き方の見本。
# このファイルをコピーして、同じフォルダ（build.gradle があるフォルダ）に secret.yml という名前で置き、値を書く。
# secret.yml は Gitで管理しない（.gitignore に入れる）。このファイル（secret.example.yml）には値を書かない。
spring:
  datasource:
    # 各自のPCのMySQLに作った、アプリ用のユーザ（equipment_dev と equipment_test の両方を使える）
    username:
    password:

app:
  slack:
    # 開発用のSlackアプリのボットトークン（xoxb- で始まる）。Slack送信の部品（ZPOP-24）から使う
    bot-token:
  # 最初の総務の担当者のメールアドレス（テーブルと最初のデータ（ZPOP-23）から使う）
  initial-admin-email:
