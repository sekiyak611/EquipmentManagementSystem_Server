# 秘密の値の書き方の見本。
# このファイルをコピーして、同じ backend フォルダに secret.yml という名前で置き、値を書く。
# secret.yml は Gitで管理しない（.gitignore に入れる）。このファイル（secret.example.yml）には値を書かない。
spring:
  datasource:
    username: equipment
    password: Admin1234

app:
  slack:
    # 開発用のSlackアプリのボットトークン（xoxb- で始まる）。Slack送信の部品（ZPOP-24）から使う
    bot-token:
  # 最初の総務の担当者のメールアドレス（テーブルと最初のデータ（ZPOP-23）から使う）
  initial-admin-email:
